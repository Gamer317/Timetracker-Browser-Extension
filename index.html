<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: eine Spalte, ein gemeinsamer Zeitstrahl läuft vertikal von alt (oben) nach neu (unten), Aktionsleiste klebt unten */
:root{
  --bg:#eceff6; --surface:#ffffff; --ink:#161d36; --muted:#59617e; --line:#d3d8e7;
  --accent:#2a4bd6; --accent-ink:#ffffff; --good:#1c8549; --bad:#c0352d; --slot:#f6f7fb;
  --joker:#8146d6; --joker-soft:#ece3fb; --disc:#1b1f2c; --groove:#2c3244;
  --f-display:"Bricolage Grotesque", "Arial Narrow", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#0f1220; --surface:#191e31; --ink:#e8ebf6; --muted:#9aa2c0; --line:#2b3250;
    --accent:#7b95ff; --accent-ink:#0c1020; --good:#4cc283; --bad:#ff7a71; --slot:#141829;
    --joker:#c09bff; --joker-soft:#2a2244; --disc:#080a12; --groove:#1a1f2e; color-scheme:dark }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);
  padding-top:env(safe-area-inset-top,0px);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
main{max-width:560px;margin:0 auto;padding-block:16px 140px;display:flex;flex-direction:column;gap:20px}
h1,h2,h3{font-family:var(--f-display);font-weight:800;line-height:1.1;margin:0;text-wrap:balance}
h1{font-size:2.4rem;letter-spacing:-.02em}
h2{font-size:1.5rem}
p{margin:0}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.label{font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
a{color:var(--accent)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:800;font-size:1.25rem}
.hero .logo{width:96px;height:96px;display:block}
.brand .logo{width:30px;height:30px;flex:none;display:block}
.brand span{white-space:nowrap}
.field{display:flex;flex-direction:column;gap:4px}
.bonusgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
@media (max-width:360px){.bonusgrid{grid-template-columns:1fr}}
.bonusline{color:var(--ink);font-weight:600}
.brand i{width:26px;height:26px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0 28%,var(--disc) 29% 100%);display:block}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px}
.steps{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:8px}
code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:.85em}
.copyrow{display:flex;gap:8px;align-items:stretch}
.copyrow code{flex:1;min-width:0;overflow-wrap:anywhere;background:var(--slot);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
select,input[type=text],input[type=number],textarea{width:100%;font:inherit;color:var(--ink);background:var(--slot);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
input:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 14px;font-weight:600}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);padding:13px 18px;font-size:1.05rem}
.btn-ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 8px;font-weight:500}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stack{display:flex;flex-direction:column;gap:10px}
.list{display:flex;flex-direction:column;gap:8px}
.pl{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:10px}
.pl img,.pl .ph{width:48px;height:48px;border-radius:6px;object-fit:cover;background:var(--slot);flex:none}
.pl .t{min-width:0;flex:1}
.pl .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:var(--bad);font-weight:600}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:10px;max-width:min(520px,calc(100vw - 32px));font-size:.9rem;z-index:20}
.devices label{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer}
.devices input{accent-color:var(--accent)}

/* Spielerleiste mit zwei Anzeigen: Punkte und Jokerpunkte */
.scores{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.ps{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ps.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.ps .top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.ps .nm{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.ps .pts{font:800 1.25rem/1 var(--f-display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ps .pts small{font:500 .75rem var(--f-body);color:var(--muted)}
.meter{display:flex;align-items:center;gap:6px;font-size:.75rem;color:var(--joker);font-weight:700}
.meter .seg{display:flex;gap:3px;flex:1}
.meter .seg i{flex:1;height:7px;border-radius:4px;background:var(--joker-soft)}
.meter .seg i.f{background:var(--joker)}
.meter.pop .seg i.f:last-of-type{animation:pop .5s ease}
@keyframes pop{50%{transform:scaleY(1.9)}}

/* Übersicht über den gemeinsamen Zeitstrahl */
.strip{position:relative;height:34px;border-radius:8px;background:var(--surface);border:1px solid var(--line);overflow:hidden}
.strip i{position:absolute;top:6px;bottom:14px;width:4px;margin-left:-2px;border-radius:2px}
.strip i.n{outline:2px solid var(--good);outline-offset:1px}
.strip span{position:absolute;bottom:1px;font-size:.65rem;color:var(--muted);font-variant-numeric:tabular-nums}

/* Mystery-Platte */
.stage{display:flex;gap:16px;align-items:center}
.disc{width:112px;height:112px;flex:none;border-radius:50%;position:relative;
  background:repeating-radial-gradient(circle,var(--disc) 0 2px,var(--groove) 2px 3px);box-shadow:0 6px 18px rgb(0 0 0/.18)}
.disc::after{content:"?";position:absolute;inset:34%;border-radius:50%;background:var(--accent);color:var(--accent-ink);
  display:grid;place-items:center;font:800 1.4rem var(--f-display)}
.disc.img::after{content:""}
.disc img{position:absolute;inset:30%;width:40%;height:40%;border-radius:50%;object-fit:cover;z-index:1}
.disc.spin{animation:spin 2.2s linear infinite}
.disc.spin.fast{animation-duration:.9s}
.disc.spin.rev{animation-direction:reverse}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.disc.spin,.meter.pop .seg i{animation:none}}
.stage .info{min-width:0;flex:1;display:flex;flex-direction:column;gap:8px}
.ctrl{display:flex;gap:8px;flex-wrap:wrap}
.badges{display:flex;gap:6px;flex-wrap:wrap}
.badge{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--joker-soft);color:var(--joker)}
.badge.bad{background:transparent;border:1px solid var(--bad);color:var(--bad)}

/* Zeitstrahl */
.tl{display:flex;flex-direction:column;gap:6px}
.card{display:flex;align-items:center;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 12px 8px 8px}
.year{font:800 1.35rem/1 var(--f-display);font-variant-numeric:tabular-nums;color:#151926;border-radius:8px;padding:10px 8px;min-width:4.4rem;text-align:center;flex:none}
.card .t{min-width:0;flex:1}
.card .t b{display:block;font-weight:600;overflow-wrap:anywhere}
.card .t span{color:var(--muted);font-size:.875rem;overflow-wrap:anywhere}
.card .who{font-size:.75rem;color:var(--muted);flex:none}
.card.new{border-color:var(--good);box-shadow:inset 0 0 0 1px var(--good)}
.card.ghost{border-style:dashed;border-color:var(--bad)}
.card.miss{border-style:dashed}
.card.miss .year{opacity:.7}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.9rem;cursor:pointer}
.check input{margin-top:3px;width:18px;height:18px;accent-color:var(--accent);flex:none}
.card.ghost .year{outline:2px dashed var(--bad);outline-offset:-2px}
.slot{width:100%;border:1.5px dashed var(--line);background:transparent;color:var(--muted);border-radius:10px;padding:9px 12px;font-weight:500;font-size:.875rem;text-align:left;display:flex;justify-content:space-between;gap:8px}
.slot:hover{border-color:var(--accent);color:var(--ink)}
.slot.sel{border-style:solid;border-color:var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.slot.wrong{border-style:solid;border-color:var(--bad);color:var(--bad);font-weight:700}
.d1950{background:#f2b544}.d1960{background:#f39060}.d1970{background:#ea79a6}.d1980{background:#b08cf2}
.d1990{background:#67aef2}.d2000{background:#4ec7b4}.d2010{background:#93d673}.d2020{background:#dcd450}.dold{background:#c9b28f}

.result{border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;border:1px solid}
.result.ok{border-color:var(--good);color:var(--good)}
.result.no{border-color:var(--bad);color:var(--bad)}
.result h3{font-size:1.3rem}
.result p{color:var(--ink)}

/* Joker-Laden */
.seg-pick{display:flex;gap:6px;flex-wrap:wrap}
.seg-pick button{padding:7px 12px;border-radius:999px;font-weight:600;font-size:.9rem}
.seg-pick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.jokers{display:grid;grid-template-columns:1fr;gap:8px}
.joker{display:flex;gap:12px;align-items:center;text-align:left;padding:12px}
.joker .t{flex:1;min-width:0}
.joker .t b{display:block}
.joker .t span{font-size:.85rem;color:var(--muted);font-weight:400}
.cost{flex:none;font:800 1rem var(--f-display);color:var(--joker);background:var(--joker-soft);border-radius:8px;padding:6px 9px;font-variant-numeric:tabular-nums}
.joker.have{border-color:var(--joker)}
.queued{display:flex;flex-direction:column;gap:6px}
.queued div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.9rem}

.bar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.bar>div{max-width:560px;margin:0 auto;display:flex;gap:10px;align-items:center}
.bar .btn-primary{flex:1}
.bar .hint{flex:1;font-size:.9rem;color:var(--muted)}

.rank{display:flex;flex-direction:column;gap:8px}
.rank div{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:10px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rank div:first-child{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.rank b{font:800 1.3rem var(--f-display);font-variant-numeric:tabular-nums}
.players input{flex:1}
.players .row{flex-wrap:nowrap}
.qr{background:#fff;padding:10px;border-radius:10px;align-self:flex-start;line-height:0}
.qr img,.qr canvas{width:176px;height:176px}
.tag{font-size:.7rem;font-weight:700;color:var(--accent);border:1px solid var(--accent);border-radius:999px;padding:1px 8px;white-space:nowrap}
.genform{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.genform label{display:flex;flex-direction:column;gap:4px;min-width:0}
.genform label:nth-child(-n+2){grid-column:1/-1}
.distbox{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.distbox[open]{display:flex}
.distbox summary{cursor:pointer;font-weight:600;font-size:.92rem}
.distbox label{display:flex;flex-direction:column;gap:4px;margin-top:8px}
.distbox input[type=range]{width:100%;accent-color:var(--accent)}
#distViz{margin-top:8px}
.roomcode{font:800 2.4rem/1 var(--f-display);letter-spacing:.18em;text-transform:uppercase;font-variant-numeric:tabular-nums}
.sound{border:1px solid var(--line)}
.sound.on{color:var(--good);border-color:var(--good)}
.rules{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:4px;font-size:.9rem}
</style>
</head>
<body>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script>
'use strict';
const app = document.getElementById('app');
const JOIN_ID = new URLSearchParams(location.search).get('join');
const GUEST = !!JOIN_ID; // Handy eines Mitspielers
const IN_APP = /ZeitstrahlApp/.test(navigator.userAgent); // Android-App
const PEERJS = 'https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js';
// Früher gemerkte Jahre und Suchergebnisse entfernen: Jahre werden jetzt immer frisch bestimmt
try{for(let i=localStorage.length-1;i>=0;i--){const k=localStorage.key(i);if(/^zs_(dz|mb|sp):/.test(k))localStorage.removeItem(k)}}catch{}
const LS = {
  get(k,d){try{const v=localStorage.getItem('zs_'+k);return v==null?d:JSON.parse(v)}catch{return d}},
  set(k,v){try{localStorage.setItem('zs_'+k,JSON.stringify(v))}catch{}},
  del(k){try{localStorage.removeItem('zs_'+k)}catch{}}
};
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const decade = y => y < 1950 ? 'dold' : 'd' + Math.min(2020, Math.floor(y/10)*10);
const decadeName = y => Math.floor(y/10)*10 + 'er';
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]} return a; };

/* Deezer als Quelle: Jahr vom frühesten passenden Deezer-Album, Wiedergabe mit Deezer-Ausschnitten */
let dzNext=0;
async function dzPace(){const now=Date.now(),at=Math.max(now,dzNext);dzNext=at+120;if(at>now)await wait(at-now)}
const dzAlbums={};
async function dzAlbum(id){
  if(id in dzAlbums) return dzAlbums[id];
  await dzPace();
  try{dzAlbums[id]=await dz(`/album/${id}`)}catch{dzAlbums[id]=null}
  return dzAlbums[id];
}
async function deezerResolve(c){
  await dzPace();
  let r={data:[]};
  try{r=await dz('/search/track',{q:`artist:"${c.artist}" track:"${c.title}"`,limit:15})}catch{}
  const t=norm(cleanTitle(c.title)), a=norm(c.artist);
  const same=(r.data||[]).filter(x=>{
    const n=norm(cleanTitle(x.title_short||x.title)), an=norm(x.artist?.name||'');
    return n&&an&&(n.startsWith(t)||t.startsWith(n))&&(an.includes(a)||a.includes(an));
  });
  const ids=[...new Set([c.albumId,...same.map(x=>x.album?.id)].filter(Boolean))].slice(0,4);
  let best=null;
  for(const id of ids){
    const al=await dzAlbum(id);
    const y=al?parseInt(String(al.release_date||'').slice(0,4),10):0;
    if(y>1850&&(!best||y<best.year)) best={year:y,img:al.cover_medium||al.cover,genre:al.genres?.data?.[0]?.name||null};
  }
  const card=best&&c.dzId?{id:'dz'+c.dzId,dzId:c.dzId,title:c.title,artist:c.artist,year:best.year,img:best.img||c.img||null,genre:bucket(best.genre)}:null;
  return {cached:false,card};
}
/* Jahre prüfen mit MusicBrainz: freie Musikdatenbank mit dem Jahr der ersten Veröffentlichung.
   MusicBrainz erlaubt etwa eine Anfrage pro Sekunde. */
let mbNext=0;
async function mbPace(){const now=Date.now(),at=Math.max(now,mbNext);mbNext=at+1100;if(at>now)await wait(at-now)}
const MB_BUCKETS=new Set(['Hip-Hop','Soul & R&B','Dance & Elektro','Deutsch','Indie & Alternative','Metal','Rock','Pop','Reggae','Jazz & Blues','Country & Folk','Soundtrack','Klassik']);
const mbArtistGenre=new Map(); // nur für die laufende Sitzung, wird nicht gespeichert
// Häufigstes MusicBrainz-Genre bzw. -Tag, das zu einem Spiel-Genre passt
function mbBucket(list){
  for(const t of [...(list||[])].sort((a,b)=>(b.count||0)-(a.count||0))){const b=bucket(t.name);if(MB_BUCKETS.has(b))return b}
  return null;
}
async function mbGet(path,params){
  for(let i=0;i<3;i++){
    await mbPace();
    const r=await fetch('https://musicbrainz.org/ws/2/'+path+'?'+new URLSearchParams({...params,fmt:'json'}));
    if(r.status===503||r.status===429){await wait(2500);continue}
    if(r.status===404) return {};
    if(!r.ok) throw new Error('MusicBrainz '+r.status);
    return await r.json();
  }
  throw new Error('MusicBrainz ausgelastet');
}
/* Jahr (und auf Wunsch Genre) bei MusicBrainz:
   1. Die genaue Aufnahme über ihre ISRC finden (Kennung, die Deezer mitliefert). Nur wenn das nichts ergibt,
      nach Titel und Interpret suchen.
   2. Als Jahr zählt die früheste offizielle Single, EP oder das früheste offizielle Album mit dieser Aufnahme.
      Sammlungen, Live-Platten, Remixe, Demos und Bootlegs zählen nicht.
   Rückgabe: null = MusicBrainz nicht erreichbar, sonst {year (0 = unbekannt), genre} */
async function mbInfo(c,wantGenre){
  const title=cleanTitle(c.title), full=String(c.artist).split(/ feat\.? | ft\.? /i)[0].trim(), art=full.split(/,| & /)[0].trim();
  const q=s=>'"'+String(s).replace(/(["\\])/g,'\\$1')+'"';
  const artistOk=rec=>{
    const names=(rec['artist-credit']||[]).map(a=>a.name||a.artist?.name||'');
    const credit=(rec['artist-credit']||[]).map(a=>(a.name||a.artist?.name||'')+(a.joinphrase||'')).join('');
    return names.some(n=>similar(n,art)||similar(n,full))||similar(credit,full);
  };
  const BAD=['compilation','live','remix','dj-mix','demo','interview','spokenword','audio drama'];
  const relOk=r=>{
    const rg=r['release-group']||{}, st=String(r.status||'').toLowerCase(), pt=String(rg['primary-type']||'').toLowerCase();
    const sec=(rg['secondary-types']||[]).map(x=>String(x).toLowerCase());
    return (!st||st==='official')&&['album','single','ep'].includes(pt)&&!sec.some(x=>BAD.includes(x));
  };
  const yearOf=rec=>{
    if(!Array.isArray(rec.releases)){const y=parseInt(String(rec['first-release-date']||'').slice(0,4),10);return y>1850?y:0}
    let y=0;
    for(const r of rec.releases){if(!relOk(r))continue;const v=parseInt(String(r.date||'').slice(0,4),10);if(v>1850&&(!y||v<y))y=v}
    return y;
  };
  try{
    let isrc=null;
    if(c.dzId){try{await dzPace();isrc=(await dz(`/track/${c.dzId}`)).isrc||null}catch{}}
    let recs=[];
    if(isrc){
      const j=await mbGet('recording',{query:`isrc:${isrc}`,limit:'25'});
      recs=(j.recordings||[]).filter(artistOk);
    }
    if(!recs.length){
      const j=await mbGet('recording',{query:`recording:${q(title)} AND (artist:${q(full)} OR artist:${q(art)})`,limit:'100'});
      recs=(j.recordings||[]).filter(rec=>(rec.score||0)>=70&&similar(cleanTitle(rec.title||''),title)&&artistOk(rec));
    }
    recs=recs.filter(rec=>!/\b(live|remix|demo|karaoke|instrumental|cover)\b/i.test(rec.disambiguation||''));
    let year=0, bestRec=null;
    for(const rec of recs){const y=yearOf(rec);if(y&&(!year||y<year)){year=y;bestRec=rec}}
    let genre=null;
    if(wantGenre){
      genre=mbBucket(recs.flatMap(r=>[...(r.genres||[]),...(r.tags||[])]));
      const aid=(bestRec||recs[0])?.['artist-credit']?.[0]?.artist?.id;
      if(!genre&&aid){
        if(!mbArtistGenre.has(aid)){
          try{const a=await mbGet(`artist/${aid}`,{inc:'genres tags'});mbArtistGenre.set(aid,mbBucket([...(a.genres||[]),...(a.tags||[])]))}
          catch{mbArtistGenre.set(aid,null)}
        }
        genre=mbArtistGenre.get(aid);
      }
    }
    return {year,genre};
  }catch{return null}
}
// Ergebnis von MusicBrainz übernehmen. Ein Jahr wird nur nach vorne korrigiert: Ein späteres Jahr
// ist fast immer eine Neuauflage, das frühere Deezer-Jahr bleibt dann stehen.
function mbApply(c,m){
  if(!m) return false;
  c.mbOk=true;
  if(m.genre) c.genre=m.genre;
  if(m.year&&m.year<c.year){c.year=m.year;return true}
  return false;
}
/* Zielverteilung der Songs über den Zeitraum: gleichmäßig oder als Glockenkurve mit Höhepunkt und Breite */
function genBins(g,from,to){
  const curve=g.dist==='curve', span=to-from+1;
  const binW=curve?(span<=60?5:10):(span<=20?5:10), bins=[];
  for(let y=from;y<=to;y+=binW)bins.push({lo:y,hi:Math.min(to,y+binW-1),songs:[]});
  const mu=Math.max(from,Math.min(to,g.mu)), sd=Math.max(1,g.sigma);
  const W=bins.map(b=>{if(!curve)return 1;let w=0;for(let y=b.lo;y<=b.hi;y++)w+=Math.exp(-((y-mu)**2)/(2*sd*sd));return w});
  const sw=W.reduce((a,b)=>a+b,0)||1, raw=W.map(w=>g.count*w/sw), qi=raw.map(Math.floor);
  let rest=g.count-qi.reduce((a,b)=>a+b,0);
  raw.map((r,i)=>[r-qi[i],i]).sort((a,b)=>b[0]-a[0]).slice(0,rest).forEach(([,i])=>qi[i]++);
  bins.forEach((b,i)=>{b.q=qi[i];b.w=W[i]});
  return {bins,binW,mu};
}
function distSvg(){
  const g=S.gen, from=Math.min(g.from,g.to), to=Math.max(g.from,g.to);
  const {bins,mu}=genBins(g,from,to);
  const Wd=320,H=130,pad=22,top=8, x=y=>pad+(y-from)/(to+1-from)*(Wd-2*pad);
  const maxQ=Math.max(1,...bins.map(b=>b.q)), h=q=>q/maxQ*(H-top-pad)*0.82;
  const bars=bins.map(b=>{const x0=x(b.lo)+1,x1=x(b.hi+1)-1,hh=h(b.q);
    return `<rect x="${x0.toFixed(1)}" y="${(H-pad-hh).toFixed(1)}" width="${Math.max(1,x1-x0).toFixed(1)}" height="${hh.toFixed(1)}" rx="2" fill="var(--accent)" opacity=".28"/>`
      +(b.q?`<text x="${((x0+x1)/2).toFixed(1)}" y="${(hh>16?H-pad-hh+11:H-pad-hh-3).toFixed(1)}" text-anchor="middle" font-size="9" font-weight="600" fill="var(--ink)">${b.q}</text>`:'')}).join('');
  let path='';
  if(g.dist==='curve'){
    // Kurve auf ihre eigene Spitze skaliert: zeigt die Form, die Balken zeigen die Anzahl
    const sd=Math.max(1,g.sigma);
    for(let i=0;i<=80;i++){const y=from+(to+1-from)*i/80, v=Math.exp(-((y+0.5-mu-0.5)**2)/(2*sd*sd));
      path+=(i?'L':'M')+x(y).toFixed(1)+','+(H-pad-v*(H-top-pad)).toFixed(1)}
  }
  // Jahreszahlen an den Abschnittsgrenzen, ohne dass sie sich überlappen
  const minGap=30;let lastX=-1e9;const tk=[];
  for(const y of bins.map(b=>b.lo)){const xx=x(y);if(xx-lastX>=minGap&&x(to+1)-xx>=minGap){tk.push([y,xx]);lastX=xx}}
  tk.push([to,x(to+1)]);
  const ticks=tk.map(([y,xx],i)=>`<text x="${xx.toFixed(1)}" y="${H-8}" text-anchor="${i===0&&xx<=pad+1?'start':i===tk.length-1?'end':'middle'}" font-size="9" fill="var(--muted)">${y}</text>`).join('');
  return `<svg viewBox="0 0 ${Wd} ${H}" width="100%" role="img" aria-label="Geplante Verteilung der Songs über die Jahre">
    <line x1="${pad}" x2="${Wd-pad}" y1="${H-pad}" y2="${H-pad}" stroke="var(--line)"/>${bars}
    ${path?`<path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>
    <line x1="${x(mu+.5).toFixed(1)}" x2="${x(mu+.5).toFixed(1)}" y1="${top}" y2="${H-pad}" stroke="var(--accent)" stroke-dasharray="3 3" opacity=".6"/>`:''}${ticks}</svg>`;
}
function distPanel(){
  const g=S.gen, from=Math.min(g.from,g.to), to=Math.max(g.from,g.to), mu=Math.max(from,Math.min(to,g.mu));
  return `<details class="distbox" ${g.dist==='curve'||g.distOpen?'open':''} id="distBox"><summary>Erweitert: Verteilung über die Jahre</summary>
    <label><span class="label">Verteilung</span><select id="genDist">
      <option value="even" ${g.dist!=='curve'?'selected':''}>Gleichmäßig über den Zeitraum</option>
      <option value="curve" ${g.dist==='curve'?'selected':''}>Eigene Kurve (Glocke)</option></select></label>
    <div id="distViz">${distSvg()}</div>
    ${g.dist==='curve'?`<label><span class="label">Schwerpunkt: <b id="muVal">${mu}</b></span>
      <input type="range" id="genMu" min="${from}" max="${to}" step="1" value="${mu}"></label>
      <label><span class="label">Breite: <b id="sdVal">${sdText(g.sigma)}</b></span>
      <input type="range" id="genSigma" min="2" max="50" step="1" value="${g.sigma}"></label>`:''}
    <p class="small muted">Die Balken zeigen, wie viele Songs aus welchem Abschnitt kommen sollen. Das ist eine grobe Vorgabe: Fehlen in einem Abschnitt Songs, füllen Songs aus den Nachbarn mit dem meisten Gewicht auf.</p>
  </details>`;
}
const sdText=s=>s<=6?`schmal (±${s} Jahre)`:s<=18?`mittel (±${s} Jahre)`:`breit (±${s} Jahre)`;
function updDist(){
  const v=document.getElementById('distViz'); if(!v) return;
  const g=S.gen, from=Math.min(g.from,g.to), to=Math.max(g.from,g.to);
  const m=document.getElementById('genMu');
  if(m){m.min=from;m.max=to;if(g.mu<from||g.mu>to){g.mu=Math.max(from,Math.min(to,g.mu));m.value=g.mu}}
  const mv=document.getElementById('muVal');if(mv)mv.textContent=Math.max(from,Math.min(to,g.mu));
  const sv=document.getElementById('sdVal');if(sv)sv.textContent=sdText(g.sigma);
  v.innerHTML=distSvg();
}
async function generatePlaylist(){
  const g=S.gen;
  if(g.busy) return;
  const lvl=DZ_LEVELS.find(l=>l.id===g.level)||DZ_LEVELS[1];
  const from=Math.min(g.from,g.to), to=Math.max(g.from,g.to);
  const useDz=true;
  LS.set('gen',{genre:g.genre,level:g.level,from:g.from,to:g.to,count:g.count,perArtist:g.perArtist,src:g.src,mb:g.mb,dist:g.dist,mu:g.mu,sigma:g.sigma});
  g.busy=true;g.cancel=false;g.genErr=null;render();
  const chk=()=>{if(g.cancel){const e=new Error('cancel');e.cancel=true;throw e}};
  try{
    // 1. Quellen sammeln: Genre-Radios und kuratierte Deezer-Playlists, für jedes Jahrzehnt eigene
    const gname=(g.genres||[]).find(x=>x.id===g.genre)?.name||'';
    const all=g.genre==='0';
    const decades=[];for(let d=Math.floor(from/10)*10;d<=to;d+=10)decades.push(d);
    const {bins,binW}=genBins(g,from,to);
    // Bei eigener Kurve nur in Jahrzehnten suchen, aus denen überhaupt Songs kommen sollen
    if(g.dist==='curve'){const keep=decades.filter(d=>bins.some(b=>b.q>0&&b.hi>=d&&b.lo<=d+9));if(keep.length)decades.splice(0,decades.length,...keep)}
    const lists=[]; // {path, label, limit, decade}
    genProgress('Suche passende Radios und Playlists bei Deezer …');
    if(all){ if(to>=2015) lists.push({path:'/chart/0/tracks',label:'Charts',limit:100}); }
    else{try{const r=await dz(`/genre/${g.genre}/radios`);(r.data||[]).slice(0,12).forEach(x=>lists.push({path:`/radio/${x.id}/tracks`,label:x.title}))}catch{}}
    chk();
    // Jahrzehnt-Namen eindeutig: „60s“ erst ab 1950, davor nur „1920s“ (sonst wäre „20s“ auch 2020)
    const decNames=d=>d>=1950?[`${String(d).slice(2)}s`,`${d}s`,`${d}er`]:[`${d}s`,`${d}er`];
    // Eine Playlist passt zum Jahrzehnt, wenn ihr Name das Jahrzehnt oder ein Jahr daraus nennt („Hits 2014“)
    const decOk=(t,d)=>{
      if(d>=1950&&new RegExp(`(^|[^0-9])${String(d).slice(2,3)}0(s|er)([^0-9]|$)`).test(t)) return true;
      for(let y=d;y<d+10;y++) if(t.includes(String(y))) return true;
      return false;
    };
    const genreWords=all?[]:norm(gname).split(' ').filter(w=>w.length>2);
    const plOk=(pl,decade)=>{
      const t=norm(pl.title);
      if(pl.nb_tracks<15) return false;
      if(genreWords.length&&!genreWords.some(w=>t.includes(w))) return false;
      if(decade!=null&&!decOk(t,decade)) return false;
      return true;
    };
    const queries=[];
    const gq=all?[]:[`${gname} classics`,`best of ${gname}`,`${gname} hits`,`greatest ${gname}`,`${gname} essentials`,`${gname} anthems`];
    gq.forEach(q=>queries.push({q,decade:null,max:2}));
    const perD={};
    for(const d of decades){
      const qs=perD[d]=[];
      for(const n of decNames(d))
        (all?[`${n} hits`,`best of ${n}`,`${n} music`,`top ${n}`,`${n} party`,`${n} classics`]
            :[`${gname} ${n}`,`${n} ${gname}`,`best of ${n} ${gname}`,`${gname} hits ${n}`]).forEach(q=>qs.push({q,decade:d,max:3}));
      // Ab 1980 gibt es viele Jahres-Playlists („Hits 2014“, „Rock 1997“): je Jahr eine Suche
      for(let y=Math.max(from,d,1980);y<=Math.min(to,d+9);y++) qs.push({q:all?`hits ${y}`:`${gname} ${y}`,decade:d,max:2});
      perD[d]=shuffle(qs);
    }
    // Reihum: erst ein Suchbegriff je Jahrzehnt, dann der nächste. So kommt kein Jahrzehnt zu kurz
    for(let added=true;added;){added=false;for(const d of decades){const x=perD[d].shift();if(x){queries.push(x);added=true}}}
    const seenPl=new Set(), perDec={};
    const cap=k=>k==='x'?10:10;
    for(const {q,decade,max} of queries){
      chk();
      const key=decade??'x';
      if((perDec[key]||0)>=cap(key)) continue;
      try{
        const r=await dz('/search/playlist',{q,limit:15});
        (r.data||[]).filter(pl=>plOk(pl,decade)).slice(0,max).forEach(pl=>{
          if(seenPl.has(pl.id)||(perDec[key]||0)>=cap(key)) return;
          seenPl.add(pl.id);perDec[key]=(perDec[key]||0)+1;
          lists.push({path:`/playlist/${pl.id}/tracks`,label:pl.title,limit:200,decade});
        });
      }catch{}
      await wait(110);
    }
    if(!lists.length) throw new Error(`Deezer hat zu „${gname||'diesem Genre'}“ im gewählten Zeitraum keine Radios oder Playlists gefunden.`);
    // 2. Songs aus den Quellen laden: nach Bekanntheit filtern, Live-, Remix- und Karaoke-Fassungen weglassen
    const junk=/\b(live|karaoke|instrumental|remix|cover|tribute|re-?recorded|sped up|slowed|nightcore|8-bit|lullaby)\b/i;
    const cands=[], seenT=new Set();
    for(let i=0;i<lists.length;i++){
      chk();
      genProgress(`Lade Songs bei Deezer: ${i+1} von ${lists.length} Listen (${lists[i].label}) …`);
      try{
        const r=await dz(lists[i].path,lists[i].limit?{limit:lists[i].limit}:{});
        for(const t of r.data||[]){
          if(!t||!t.title||!t.artist?.name||(t.rank||0)<lvl.min) continue;
          if(junk.test(t.title)||junk.test(t.artist.name)) continue;
          const title=t.title_short||t.title;
          const k=norm(title)+'|'+norm(t.artist.name);
          if(seenT.has(k)) continue; seenT.add(k);
          cands.push({title,artist:t.artist.name,artistId:t.artist.id||t.artist.name,rank:t.rank,decade:lists[i].decade,dzId:t.id,albumId:t.album?.id,img:t.album?.cover_medium||null});
        }
      }catch{}
      await wait(110); // Deezer erlaubt etwa 50 Anfragen in 5 Sekunden
    }
    if(!cands.length) throw new Error(`Keine Songs mit „${lvl.name}“ gefunden. Wähle eine niedrigere Bekanntheit.`);
    // 3. Zeitraum in gleich große Abschnitte teilen; jeder Abschnitt soll etwa gleich viele Songs bekommen
    const binOf=y=>bins[Math.min(bins.length-1,Math.floor((y-from)/binW))];
    // Kandidaten nach ihrem Jahrzehnt-Hinweis reihum mischen, damit alle Zeiträume früh geprüft werden
    // Jede Quelle gehört zu einem Jahrzehnt. Als Nächstes wird immer ein Song aus dem Jahrzehnt geprüft,
    // das gerade am wenigsten Songs hat. Bringt ein Jahrzehnt lange nichts, kommen die anderen dran.
    const groups={};for(const c of shuffle(cands)){const k=c.decade??'x';(groups[k]=groups[k]||{list:[],miss:0,tried:0,got:0,lists:0,cands:0}).list.push(c)}
    for(const k in groups) groups[k].cands=groups[k].list.length;
    lists.forEach(l=>{const k=l.decade??'x';if(groups[k])groups[k].lists++});
    // Abschnitt eines Jahrzehnts mit den wenigsten Songs (bei 5-Jahres-Abschnitten gibt es zwei)
    const fill=b=>b.songs.length/Math.max(1,g.mb&&b.q?Math.ceil(b.q*1.3)+1:b.q);
    const binFor=k=>{if(k==='x')return null;let r=null;for(const b of bins)if(b.q>0&&b.songs.length<(g.mb?Math.ceil(b.q*1.3)+1:b.q)&&b.hi>=+k&&b.lo<=+k+9&&(!r||fill(b)<fill(r)))r=b;return r};
    const nextCand=()=>{
      let bestK=null,bestN=Infinity;
      for(const k in groups){
        const gr=groups[k],b=binFor(k);
        if(!gr.list.length||!b||gr.miss>=60) continue;
        const n=fill(b)+Math.random()*0.1;
        if(n<bestN){bestN=n;bestK=k}
      }
      if(bestK==null){
        const ks=Object.keys(groups).filter(k=>groups[k].list.length);
        if(!ks.length) return null;
        bestK=ks.includes('x')?'x':ks[Math.floor(Math.random()*ks.length)];
      }
      const c=groups[bestK].list.shift();c.gk=bestK;return c;
    };
    const seen=new Set(), perArtist={};
    let tried=0, found=0;
    const maxTries=Math.max(g.count*(bins.length>6?10:6),400);
    let outOfRange=0, noMatch=0, lastGain=0, cached=0, blocked=0;
    const full=()=>bins.every(b=>b.songs.length>=(g.mb&&b.q?Math.ceil(b.q*1.3)+1:b.q));
    // So viele Songs kämen jetzt bei gleichmäßiger Verteilung in die Playlist
    const usable=()=>{let n=0,spare=0;for(const b of bins){n+=Math.min(b.songs.length,b.q);spare+=Math.max(0,b.songs.length-b.q)}return n+Math.min(spare,Math.max(0,g.count-n))};
    // 4. Erscheinungsjahr bei Deezer bestimmen: das früheste passende Album zählt.
    // Mit MusicBrainz-Prüfung etwas Vorrat je Abschnitt sammeln, weil Korrekturen Songs verschieben
    const need=b=>g.mb&&b.q?Math.ceil(b.q*1.3)+1:b.q;
    async function resolveOne(c){
      const gr=groups[c.gk];
      tried++;gr.tried++;gr.miss++;
      try{
        let card=(await deezerResolve(c)).card;chk();
        if(card&&!card.genre&&g.genre!=='0'&&gname) card={...card,genre:bucket(gname)};
        if(!card){noMatch++;return null}
        if(card.year<from||card.year>to){outOfRange++;return null}
        if(seen.has(card.id)) return null;
        const key=norm(card.title)+'|'+norm(card.artist);
        if(seen.has(key)||(perArtist[c.artistId]||0)>=g.perArtist) return null;
        seen.add(card.id);seen.add(key);perArtist[c.artistId]=(perArtist[c.artistId]||0)+1;
        const bin=binOf(card.year);if(bin.songs.length<need(bin))lastGain=tried;
        if(c.gk!=='x'&&card.year>=+c.gk&&card.year<=+c.gk+9){gr.miss=0;gr.got++}
        bin.songs.push(card);found++;
        return card;
      }catch(e){
        if(e.cancel||e.stop||e.status===401||e.status===403)throw e;
        blocked++;
        // Antwortet Deezer dauerhaft nicht, nicht minutenlang weiterprobieren
        if(blocked>=3&&!g.cancel){g.cancel=true;const err=new Error('Deezer antwortet gerade nicht zuverlässig. Prüfe die Internetverbindung und versuch es in ein paar Minuten noch einmal.');err.stop=true;throw err}
        return null;
      }
    }
    await Promise.all(Array.from({length:3},async()=>{
      // Weitersuchen, bis jeder Zeitabschnitt seinen Anteil hat. Aufhören erst, wenn ein Abschnitt
      // lange nichts mehr dazubekommt (dann gibt es dafür bei Deezer kaum Songs) oder nichts mehr übrig ist
      while(tried<maxTries&&!full()&&!(usable()>=g.count&&tried-lastGain>120)&&tried-lastGain<250){
        chk();
        const c=nextCand(); if(!c) break;
        if((perArtist[c.artistId]||0)>=g.perArtist) continue;
        genProgress(`Prüfe Jahre bei Deezer: ${Math.min(g.count,usable())} von ${g.count} Songs beisammen, ${tried} geprüft …`);
        await resolveOne(c);
      }
    }));
    chk();
    // 5. Jahre mit MusicBrainz prüfen, mit Rückkopplung: Verschiebt eine Korrektur einen Song in einen
    //    anderen Abschnitt, wird gezielt für den Abschnitt nachgeprüft, der am weitesten unter seinem Soll liegt.
    //    Ist der Vorrat eines Abschnitts aufgebraucht, holt das Spiel bei Deezer neue Songs dafür.
    let mbFixed=0, mbDropped=0, mbFailed=0, checks=0;
    const ver=new Map(bins.map(b=>[b,[]])), pool=new Map(bins.map(b=>[b,shuffle(b.songs.slice())]));
    bins.forEach(b=>b.songs=[]);
    const inBin=(b,y)=>y>=b.lo&&y<=b.hi;
    async function moreFor(b){
      for(let n=0;n<30;n++){
        chk();
        const ks=Object.keys(groups).filter(k=>groups[k].list.length&&k!=='x'&&b.hi>=+k&&b.lo<=+k+9);
        const k=ks.length?ks[Math.floor(Math.random()*ks.length)]:(groups.x?.list.length?'x':null);
        if(k==null) return null;
        const c=groups[k].list.shift();c.gk=k;
        if((perArtist[c.artistId]||0)>=g.perArtist) continue;
        const card=await resolveOne(c);
        if(!card) continue;
        const cb=binOf(card.year);cb.songs.splice(cb.songs.indexOf(card),1);
        if(cb===b) return card;
        pool.get(cb).push(card);
      }
      return null;
    }
    if(g.mb){
      const budget=g.count*3+20, dead=new Set();
      const vfill=b=>ver.get(b).length/Math.max(1,b.q);
      const have=()=>bins.reduce((n,b)=>n+Math.min(ver.get(b).length,b.q),0);
      while(checks<budget){
        chk();
        // MusicBrainz nicht erreichbar: nicht für jeden Song erneut warten, Deezer-Jahre nehmen
        if(mbFailed>=3&&mbFailed>=checks*0.8) break;
        const needy=bins.filter(b=>b.q>0&&ver.get(b).length<b.q&&!dead.has(b)).sort((a,b)=>vfill(a)-vfill(b));
        if(!needy.length) break;
        const b=needy[0];
        let c=pool.get(b).shift();
        if(!c){
          genProgress(`Verteilung ausgleichen: suche bei Deezer weitere Songs für ${b.lo}–${b.hi} …`);
          c=await moreFor(b);
          if(!c){dead.add(b);continue}
        }
        genProgress(`Prüfe Jahre bei MusicBrainz: ${have()} von ${g.count} Songs passen, ${checks} geprüft${mbFixed?`, ${mbFixed} korrigiert`:''} …`);
        checks++;
        const m=await mbInfo(c,all);chk();
        if(m==null) mbFailed++;
        else if(mbApply(c,m)) mbFixed++;
        if(c.year<from||c.year>to){mbDropped++;continue}
        ver.get(binOf(c.year)).push(c);
      }
    }else bins.forEach(b=>{ver.set(b,pool.get(b));pool.set(b,[])});
    // 6. Zusammenstellen: aus jedem Abschnitt sein Soll, Lücken füllen Abschnitte mit viel Gewicht.
    //    Erst geprüfte Songs, nur notfalls ungeprüfte.
    let out=[];
    bins.forEach(b=>out.push(...ver.get(b).splice(0,b.q)));
    const fillUp=src=>{
      const list=[];bins.forEach(b=>src.get(b).forEach(s=>list.push({s,r:b.w*(0.5+Math.random())})));
      list.sort((a,b)=>b.r-a.r);for(const x of list){if(out.length>=g.count)break;out.push(x.s)}
    };
    fillUp(ver);
    if(out.length<g.count) fillUp(pool);
    if(out.length<5) throw new Error(`Nur ${out.length} passende Songs gefunden. Deezer lieferte ${cands.length} Songs aus ${lists.length} Listen; bei Deezer geprüft: ${tried}, davon ${outOfRange} außerhalb des Zeitraums, ${noMatch} nicht gefunden${blocked?` und ${blocked} ohne Antwort`:''}. Erweitere den Zeitraum oder wähle ein anderes Genre.`);
    if(g.mb&&mbFixed) toast(`MusicBrainz hat ${mbFixed} ${mbFixed===1?'Jahr':'Jahre'} korrigiert.`);
    if(g.mb&&mbFailed>=3&&mbFailed>=out.length/2) toast('MusicBrainz war nicht erreichbar, die Jahre stammen von Deezer.');
    S.tracks=shuffle(out);S.genreFixed=!all;S.savedName=null;S.baseSource=null;S.source=`${gname||'Genre'} · ${lvl.name} · ${from}–${to}`;S.mode='deezer';g.busy=false;
    const why=b=>{const k=Object.keys(groups).find(k=>k!=='x'&&b.hi>=+k&&b.lo<=+k+9),gr=k&&groups[k];
      return gr?` (${gr.lists} Listen, ${gr.cands} Songs, ${gr.tried} geprüft)`:' (keine passende Deezer-Playlist gefunden)'};
    const empty=bins.filter(b=>b.q>0&&!out.some(s=>s.year>=b.lo&&s.year<=b.hi)).map(b=>(binW===10?`${b.lo}er`:`${b.lo}–${b.hi}`)+why(b));
    if(out.length<g.count) toast(`Es wurden ${out.length} statt ${g.count} Songs gefunden.${empty.length?` Ohne Songs: ${empty.join(', ')}.`:''}`);
    else if(empty.length) toast(`Für ${empty.join(', ')} gab es keine passenden Songs.`);
    go('setup');
  }catch(e){
    g.busy=false;
    if(e.stop){g.genErr=e.message;render();return}
    if(e.cancel){g.genErr=null;toast('Playlist-Erstellung abgebrochen.');render();return}
    g.genErr=e.message;
    render();
  }
}

/* ---------- Deezer-Playlist per Link laden ---------- */
function parseDzPlaylist(s){
  s=String(s||'').trim();
  const m=s.match(/playlist\/(\d+)/);
  return m?m[1]:(/^\d{4,}$/.test(s)?s:null);
}
async function loadDeezerPlaylist(){
  const g=S.gen;
  if(g.busy) return;
  const id=parseDzPlaylist(document.getElementById('dzLink')?.value);
  if(!id){toast('Das ist kein Deezer-Playlist-Link. Er enthält „/playlist/“ und eine Nummer. Kurzlinks wie deezer.page.link öffne vorher im Browser und kopiere die volle Adresse.');return}
  g.busy=true;g.cancel=false;g.genErr=null;render();
  const chk=()=>{if(g.cancel){const e=new Error('cancel');e.cancel=true;throw e}};
  try{
    genProgress('Lade die Playlist bei Deezer …');
    const info=await dz(`/playlist/${id}`);chk();
    const tracks=[];
    for(let idx=0;tracks.length<500;){
      const r=await dz(`/playlist/${id}/tracks`,{limit:100,index:idx});chk();
      const d=r.data||[];tracks.push(...d);
      if(!r.next||!d.length) break;
      idx+=d.length;await wait(120);
    }
    const seenT=new Set();
    const cands=tracks.filter(t=>t&&t.title&&t.artist?.name&&t.readable!==false).map(t=>({title:t.title_short||t.title,artist:t.artist.name,artistId:t.artist.id,dzId:t.id,albumId:t.album?.id,img:t.album?.cover_medium||null}))
      .filter(c=>{const k=norm(c.title)+'|'+norm(c.artist);if(seenT.has(k))return false;seenT.add(k);return true});
    if(!cands.length) throw new Error('Die Playlist ist leer oder nicht öffentlich.');
    const total=cands.length, out=[];let done=0;
    await Promise.all([0,1,2].map(async()=>{
      while(cands.length){
        chk();
        const c=cands.shift();
        const res=await deezerResolve(c);done++;
        genProgress(`Bestimme Jahre bei Deezer: ${done} von ${total} Songs …`);
        if(res.card) out.push(res.card);
      }
    }));
    let fixed=0;
    if(g.mb){
      for(let i=0;i<out.length;i++){
        chk();
        genProgress(`Prüfe Jahre bei MusicBrainz: ${i} von ${out.length} Songs${fixed?`, ${fixed} korrigiert`:''} …`);
        const m=await mbInfo(out[i],true);
        if(mbApply(out[i],m)) fixed++;
        if(m==null&&i>=2&&!out.slice(0,i+1).some(c=>c.mbOk)) break;
      }
    }
    if(out.length<5) throw new Error(`Nur ${out.length} Songs dieser Playlist ließen sich einem Jahr zuordnen. Für ein Spiel braucht es mindestens 5.`);
    S.tracks=shuffle(out);S.genreFixed=false;S.savedName=null;S.baseSource=null;S.source=`${info.title||'Deezer-Playlist'} · Deezer-Playlist`;S.mode='deezer';g.busy=false;
    if(fixed) toast(`MusicBrainz hat ${fixed} ${fixed===1?'Jahr':'Jahre'} korrigiert.`);
    go('setup');
  }catch(e){
    g.busy=false;
    if(e.cancel){toast('Laden abgebrochen.');render();return}
    g.genErr=/no data|not found|invalid/i.test(e.message)?'Diese Playlist gibt es nicht oder sie ist privat.':e.message;
    render();
  }
}

/* ---------- Hilfen für Deezer-Abfragen und Ausschnitte ---------- */
let jsonpN=0;
function jsonp(url){
  return new Promise((res,rej)=>{

  if(!P){NET.status='error';NET.error='Die Verbindungsbibliothek ließ sich nicht laden. Prüfe die Internetverbindung.';render();return}
  let id=null;try{id=sessionStorage.getItem('zs_room')}catch{}
  if(!id) id='zeitstrahl-'+roomCode();
  const peer=new P(id,{debug:0});
  NET.peer=peer;
  peer.on('open',pid=>{NET.id=pid;NET.status='ready';S.hosted=true;try{sessionStorage.setItem('zs_room',pid)}catch{}render()});
  peer.on('connection',conn=>{
    conn.on('open',()=>{NET.conns.set(conn.peer,{conn,guest:null});sendState(conn)});
    conn.on('data',d=>{try{onGuestData(conn,d)}catch(e){console.error(e)}});
    const drop=()=>NET.conns.delete(conn.peer);
    conn.on('close',drop);conn.on('error',drop);
  });
  peer.on('disconnected',()=>{try{peer.reconnect()}catch{}});
  peer.on('error',e=>{
    if(e.type==='unavailable-id'){try{sessionStorage.removeItem('zs_room')}catch{}peer.destroy();NET.status='off';setTimeout(startRoom,500);return}
    if(['network','server-error','socket-error','socket-closed','browser-incompatible'].includes(e.type)&&NET.status!=='ready'){
      NET.status='error';NET.error=e.type==='browser-incompatible'?'Dieser Browser unterstützt keine direkten Verbindungen.':'Keine Verbindung zum Vermittlungsdienst. Prüfe die Internetverbindung.';render();
    }
  });
}
function retryRoom(){if(NET.peer){try{NET.peer.destroy()}catch{}}NET.status='off';startRoom();render()}
function sendState(conn){try{if(conn.open)conn.send({kind:'state',state:publicState()})}catch{}}
function onGuestData(conn,d){
  if(!d||typeof d!=='object'||typeof d.type!=='string') return;
  const e=NET.conns.get(conn.peer)||{conn,guest:null};NET.conns.set(conn.peer,e);
  const idOk=typeof d.id==='string'&&/^[a-z0-9]{6,32}$/.test(d.id)&&typeof d.secret==='string'&&d.secret.length>=8;
  if(d.type==='hello'||d.type==='join'){
    if(!idOk) return;
    const known=NET.secrets[d.id];
    if(known&&known!==d.secret){conn.send({kind:'error',msg:'Dieser Spieler ist schon mit einem anderen Gerät verbunden.'});return}
    if(d.type==='hello'){if(known)e.guest=d.id;sendState(conn);return}
    const name=String(d.name||'').trim().slice(0,20);
    if(!name) return;
    NET.secrets[d.id]=d.secret;e.guest=d.id;
    handleGuest({type:'join',id:d.id,name});
    conn.send({kind:'joined'});sendState(conn);
    return;
  }
  if(!e.guest) return;
  handleGuest({...d,id:e.guest});
}
let pubTimer=null;
function publish(){
  if(!NET.conns.size) return;
  clearTimeout(pubTimer);
  pubTimer=setTimeout(()=>{const msg={kind:'state',state:publicState()};for(const {conn} of NET.conns.values()){try{if(conn.open)conn.send(msg)}catch{}}},60);
}

function pubFx(fx,m){
  const o={};if(!fx)return o;
  if(fx.double)o.double=true;
  if(fx.decade)o.decade=m?decadeName(m.year):true;
  if(fx.genre)o.genre=fx.genre;
  if(fx.turbo)o.turbo={by:fx.turbo.by};
  if(fx.reverse)o.reverse={by:fx.reverse.by};
  if(fx.snippet)o.snippet={by:fx.snippet.by};
  if(fx.hideWrong)o.hideWrong=true;
  return o;
}

function publicState(){
  const st={screen:S.screen,target:S.target,genreFixed:!!S.genreFixed,source:S.source,minY:S.minY,maxY:S.maxY,goal:S.goal,noJokers:!!S.noJokers,keepWrong:!!S.keepWrong,bonus:!!S.bonus};
  if(S.screen!=='game'&&S.screen!=='end'){st.lobby=S.roster.map(r=>({name:r.name,guest:r.guest||null}));return st}
  st.players=S.players.map(p=>({name:p.name,score:p.score,jp:p.jp,guest:p.guest,fx:pubFx(p.fx)}));
  st.timeline=(S.screen==='game'?curTl():S.timeline).map(c=>({year:c.year,title:c.title,artist:c.artist,by:c.by,wrong:!!c.wrong}));
  st.cur=S.cur;st.phase=S.phase;st.deck=S.deck.length;st.jpPop=S.jpPop;
  if(S.screen==='game'){
    const m=S.mystery;
    st.turnFx=pubFx(S.turnFx,m);
    st.mystery=S.phase==='reveal'&&m?{title:m.title,artist:m.artist,year:m.year,img:m.img||null}:null;
    st.result=S.result;
    const ai=['el','rev'].includes(S.audioKind)&&S.aInfo?S.aInfo:null;
    st.audio={kind:S.audioKind,playing:S.playing,noAudio:S.noAudio,searching:!!S.misses,seq:S.aSeq,url:ai?.url||null,rate:ai?.rate||1,rev:!!ai?.rev,off:ai?.off||0,snip:snipActive()?SNIP_MS:0};
    if(S.phase==='shop') st.genre=S.shop.genre;
  }
  return st;
}
function handleGuest(a){
  if(a.type==='join'){
    const name=String(a.name||'').slice(0,20);
    const r=S.roster.find(x=>x.guest===a.id);
    if(r) r.name=name; else S.roster.push({name,guest:a.id});
    if(S.screen==='game'){
      const p=S.players.find(x=>x.guest===a.id);
      if(p) p.name=name; else {S.players.push({name,score:0,jp:0,fx:{},guest:a.id});toast(`${name} spielt jetzt mit.`)}
    }else if(!r) toast(`${name} ist beigetreten.`);
    render();return;
  }
  if(S.screen!=='game') return;
  const pi=S.players.findIndex(p=>p.guest===a.id); if(pi<0) return;
  const mine=pi===S.cur, tl=curTl();
  switch(a.type){
    case 'place':
      if(mine&&S.phase==='guess'&&a.tlLen===tl.length&&Number.isInteger(a.slot)&&a.slot>=0&&a.slot<=tl.length){
        S.bonusIn={artist:String(a.artist||'').slice(0,100),title:String(a.title||'').slice(0,100)};
        S.slot=a.slot;place();
      }
      break;
    case 'next': if(mine&&S.phase==='reveal') next(); break;
    case 'go': if(mine&&S.phase==='shop') nextTurn(); break;
    case 'buy': if(S.phase==='shop'&&a.joker!=='genre'&&!(a.joker==='genre'&&S.genreFixed)){buyFor(pi,a.joker,+a.target);render()} break;
    case 'genreOpen': if(S.phase==='shop'&&!S.genreFixed) openGenresFor(pi); break;
    case 'genreClose': if(S.phase==='shop'){delete S.shop.genre[pi];render()} break;
    case 'genre': if(S.phase==='shop'){pickGenreFor(pi,String(a.genre));render()} break;
    case 'undo': if(S.phase==='shop'){undoFx(+a.pi,a.joker,pi);render()} break;
    case 'toggle': if(mine&&S.phase!=='shop') togglePlay(); break;
    case 'replay': if(mine&&S.phase!=='shop') replay(); break;
    case 'skip': if(mine&&S.phase==='guess'&&S.noAudio) skipSong(); break;
  }
}
let qrLib=null;
function loadQr(){
  if(!qrLib) qrLib=new Promise(res=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';s.onload=()=>res(window.QRCode||null);s.onerror=()=>res(null);document.head.appendChild(s)});
  return qrLib;
}
function drawQr(){
  const els=[...document.querySelectorAll('[data-qr]')];if(!els.length)return;
  loadQr().then(Q=>els.forEach(el=>{
    if(!el.isConnected||el.dataset.done)return;
    if(!Q){el.remove();return}
    el.dataset.done='1';
    new Q(el,{text:el.dataset.qr,width:176,height:176,colorDark:'#111111',colorLight:'#ffffff',correctLevel:Q.CorrectLevel.M});
  }));
}

/* ---------- Ton auf dem Gerät der Mitspieler ----------
   Der Host schickt mit dem Spielstand, was gerade läuft (Ausschnitt, Tempo, rückwärts, Startpunkt).
   Jedes Gerät spielt den Ausschnitt selbst ab. */
const GA={el:new Audio(),ctx:null,bufs:{},src:null,seq:-1,playing:false,on:false,kind:null};
GA.el.preload='auto';
function gaStop(){
  GA.el.pause();
  if(GA.src){try{GA.src.stop()}catch{}GA.src=null}
  GA.playing=false;GA.kind=null;
}
async function gaRevBuf(url){
  if(GA.bufs[url]) return GA.bufs[url];
  const r=await fetch(url);const ab=await GA.ctx.decodeAudioData(await r.arrayBuffer());
  for(let c=0;c<ab.numberOfChannels;c++) ab.getChannelData(c).reverse();
  return GA.bufs[url]=ab;
}
async function gaStart(a){
  gaStop();
  const seq=a.seq;
  if(a.rev){
    try{
      if(!GA.ctx) GA.ctx=new (window.AudioContext||window.webkitAudioContext)();
      const buf=await gaRevBuf(a.url);
      if(GA.seq!==seq) return;
      const src=GA.ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=a.rate||1;src.connect(GA.ctx.destination);
      GA.ctx.resume();
      if(a.snip) src.start(0,a.off||0,a.snip/1000*(a.rate||1)); else src.start(0,a.off||0);
      GA.src=src;GA.kind='rev';GA.playing=true;
      if(!a.playing){GA.ctx.suspend();GA.playing=false}
      return;
    }catch{/* rückwärts geht hier nicht: normal abspielen */}
  }
  const el=GA.el;el.src=a.url;
  const r=a.rate||1;el.defaultPlaybackRate=r;el.playbackRate=r;
  const keep=r===1;el.preservesPitch=keep;el.mozPreservesPitch=keep;el.webkitPreservesPitch=keep;
  GA.kind='el';
  if(!a.playing) return;
  try{await el.play();if(GA.seq!==seq)return;el.playbackRate=r;if(a.off)el.currentTime=a.off;GA.playing=true}
  catch{GA.on=false;gRender()}
}
function gaSync(st){
  const a=st&&st.screen==='game'?st.audio:null;
  if(!GA.on||!a||!a.url){if(GA.kind)gaStop();GA.seq=-1;return}
  if(a.seq!==GA.seq){GA.seq=a.seq;gaStart(a);return}
  if(a.playing&&!GA.playing){
    if(GA.kind==='el'){GA.el.play().then(()=>GA.playing=true).catch(()=>{})}
    if(GA.kind==='rev'&&GA.ctx){GA.ctx.resume();GA.playing=true}
  }else if(!a.playing&&GA.playing){
    if(GA.kind==='el') GA.el.pause();
    if(GA.kind==='rev'&&GA.ctx) GA.ctx.suspend();
    GA.playing=false;
  }
}
function gaToggle(){
  GA.on=!GA.on;
  if(GA.on){
    // muss direkt im Tippen passieren, damit das Gerät Ton erlaubt
    try{GA.el.src=SILENT;GA.el.play().catch(()=>{})}catch{}
    try{if(!GA.ctx)GA.ctx=new (window.AudioContext||window.webkitAudioContext)();GA.ctx.resume()}catch{}
    GA.seq=-1;setTimeout(()=>gaSync(G.st),150);
  }else gaStop();
  gRender();
}
/* ---------- Handy der Mitspieler ---------- */
const G={host:JOIN_ID,me:null,joined:false,st:null,slot:null,target:null,bonusIn:{artist:'',title:''},name:LS.get('guestName',''),offline:true,missing:0,busy:false,conn:null,peer:null,refused:null};
if(GUEST){
  let me=LS.get('gid',null);
  if(!me){const h=b=>[...b].map(x=>x.toString(16).padStart(2,'0')).join('');me={id:h(randBytes(6)),secret:h(randBytes(12))};LS.set('gid',me)}
  G.me=me;G.joined=LS.get('joined_'+JOIN_ID,false);
}
async function gConnect(){
  const P=await loadPeerLib();
  if(!P){G.refused='Die Verbindungsbibliothek ließ sich nicht laden. Prüfe die Internetverbindung und lade die Seite neu.';gRender();return}
  const peer=new P(undefined,{debug:0});G.peer=peer;
  peer.on('open',()=>gOpenConn());
  peer.on('disconnected',()=>{try{peer.reconnect()}catch{}});
  peer.on('error',e=>{
    if(e.type==='peer-unavailable'){G.missing++;G.offline=true;gRender();setTimeout(gOpenConn,4000);return}
    if(e.type==='browser-incompatible'){G.refused='Dieser Browser unterstützt keine direkten Verbindungen. Versuch es mit Chrome oder Safari.';gRender();return}
  });
}
function gOpenConn(){
  if(!G.peer||G.peer.destroyed) return;
  if(G.conn&&G.conn.open) return;
  const conn=G.peer.connect(G.host,{reliable:true,serialization:'json'});G.conn=conn;
  conn.on('open',()=>{
    G.offline=false;G.missing=0;
    conn.send(G.joined?{type:'join',id:G.me.id,secret:G.me.secret,name:G.name}:{type:'hello',id:G.me.id,secret:G.me.secret});
    gRender();
  });
  conn.on('data',d=>{
    if(!d||typeof d!=='object') return;
    if(d.kind==='state'){const prev=G.st;G.st=d.state;onGState(prev)}
    else if(d.kind==='joined'){G.joined=true;G.busy=false;LS.set('joined_'+G.host,true);gRender()}
    else if(d.kind==='error'){toast(d.msg);G.busy=false;gRender()}
  });
  const lost=()=>{if(G.conn!==conn)return;G.conn=null;G.offline=true;gRender();setTimeout(gOpenConn,3000)};
  conn.on('close',lost);conn.on('error',lost);
}
function gJoin(){
  const el=document.getElementById('gname');
  const name=(el?el.value:G.name).trim();
  if(!name){toast('Bitte gib deinen Namen ein.');return}
  G.name=name;LS.set('guestName',name);
  if(!G.conn||!G.conn.open){toast('Noch keine Verbindung zum Host. Einen Moment …');return}
  G.busy=true;gRender();
  G.conn.send({type:'join',id:G.me.id,secret:G.me.secret,name});
}
function gSend(action){
  if(!G.conn||!G.conn.open){toast('Keine Verbindung zum Host.');return}
  G.conn.send(action);
}
function onGState(prev){
  const s=G.st;
  gaSync(s);
  if(s&&(!prev||prev.cur!==s.cur||prev.phase!==s.phase||prev.screen!==s.screen||(prev.timeline||[]).length!==(s.timeline||[]).length)) G.slot=null;
  if(s&&prev&&(prev.cur!==s.cur||prev.phase!==s.phase)) G.bonusIn={artist:'',title:''};
  gRender();
  if(s&&prev&&(prev.phase!==s.phase||prev.screen!==s.screen)) window.scrollTo(0,0);
}

function gGame(s,me){
  if(s.phase==='shop') return gShop(s,me);
  const p=s.players[s.cur], my=s.cur===me, rev=s.phase==='reveal', r=s.result, m=s.mystery, au=s.audio||{};
  const ctrl=!my?''
    :['el','rev'].includes(au.kind)?`<div class="ctrl"><button data-g="toggle">${au.playing?'Pause':'Abspielen'}</button><button data-g="replay">Von vorn</button></div>`

    :au.noAudio&&!rev?'<p class="small err">Der Song lässt sich gerade nicht abspielen.</p><div class="ctrl"><button data-g="skip">Anderen Song nehmen</button></div>':'';
  const stage=stageHtml({m,rev,fx:s.turnFx||{},label:my?'Du bist dran':`${esc(p.name)} ist dran`,ctrl,playing:au.playing});
  const bar=my&&!rev?`<span class="hint">${G.slot==null?'Tippe auf eine Lücke im Zeitstrahl.':esc(slotLabel(s.timeline,G.slot))}</span><button class="btn-primary" style="flex:none" data-g="place" ${G.slot==null?'disabled':''}>Einordnen</button>`
    :my&&rev?'<button class="btn-primary" data-g="next">Weiter</button>'
    :`<span class="hint">${rev?`Warte, bis ${esc(p.name)} weitermacht …`:`${esc(p.name)} ordnet gerade ein.`}</span>`;
  return `${scoresHtml(s.cur,me)}${stage}${rev?resultHtml(r,m,baseTl(s.timeline,r),my?'du hattest':p.name+' hatte'):''}
    ${my&&!rev&&s.bonus?bonusInputs('g',G.bonusIn):''}
    ${timelineHtml({tl:rev?baseTl(s.timeline,r):s.timeline,rev,r,m,interactive:my&&!rev,slot:G.slot,deck:s.deck})}
    <div class="bar"><div>${bar}</div></div>`;
}
function gShop(s,me){
  const nextP=s.players[s.cur], ti=gTarget(s,me);
  const bar=s.cur===me?'<button class="btn-primary" data-g="go">Meinen Song starten</button>'
    :`<span class="hint">Als Nächstes ist ${esc(nextP.name)} dran und startet den Song.</span>`;
  return `${scoresHtml(s.cur,me)}
    <section class="stack"><span class="label">Vor dem nächsten Song</span><h2>Joker einsetzen</h2>
    <p class="muted small">${s.cur===me?'Du bist als Nächstes dran.':`Als Nächstes ist ${esc(nextP.name)} dran.`} Hilfen gelten bei deinem nächsten Zug.</p></section>
    ${shopPanels(s.players,me,ti,s.genre?.[me])}
    ${queueHtml(s.players,(pi,type,v)=>JOKERS[type].kind==='sab'?v.by===me:pi===me)}
    <div class="bar"><div>${bar}</div></div>`;
}
function gRender(){
  const s=G.st;
  if(s?.players) V={players:s.players,target:s.target,timeline:s.timeline||[],minY:s.minY,maxY:s.maxY,jpPop:s.jpPop,genreFixed:s.genreFixed,goal:s.goal,noJokers:s.noJokers,keepWrong:s.keepWrong,bonus:s.bonus};
  let h=`<header><div class="brand">${LOGO}<span>Timetracker</span></div><div class="row" style="gap:8px">${G.offline&&G.st?'<span class="small err">Verbindung unterbrochen …</span>':''}<button class="btn-ghost small sound ${GA.on?'on':''}" data-g="sound">${GA.on?'Ton an':'Ton einschalten'}</button><a class="small" href="${esc(location.pathname)}">Startmenü</a></div></header>`;
  if(G.refused) h+=`<section class="stack"><h2>Keine Verbindung</h2><p class="muted">${esc(G.refused)}</p></section>`;
  else if(!s&&G.missing) h+=`<section class="stack"><h2>Raum nicht gefunden</h2><p class="muted">Der Host hat den Raum noch nicht geöffnet oder das Spiel geschlossen. Ich versuche es weiter …</p><p class="small muted">Raumcode: ${esc(G.host.replace('zeitstrahl-',''))}</p></section>`;
  else if(!s) h+='<p class="muted">Verbinde mit dem Host …</p>';
  else if(!G.joined) h+=gJoinForm(s);
  else if(s.screen==='game'||s.screen==='end'){
    const me=myIdx();
    if(me<0) h+=`<section class="stack"><h2>Das Spiel läuft schon</h2><p class="muted">Du bist noch nicht in der Spielerliste.</p><button class="btn-primary" data-g="join">Mitspielen</button></section>`;
    else h+=s.screen==='end'?endHtml(s.players,me):gGame(s,me);
  }
  else h+=gLobby(s);
  keepFocus(()=>{app.innerHTML=h});
}
function gClick(e){
  const b=e.target.closest('button');if(!b)return;
  const d=b.dataset, s=G.st;
  if(d.slot!=null){G.slot=+d.slot;gRender();return}
  if(d.target!=null){G.target=+d.target;gRender();return}
  if(d.buy){const me=myIdx();if(d.buy==='genre')gSend({type:'genreOpen'});else gSend({type:'buy',joker:d.buy,target:gTarget(s,me)});return}
  if(d.genre){gSend({type:'genre',genre:d.genre});return}
  if(d.genreClose){gSend({type:'genreClose'});return}
  if(d.undo){const [i,t]=d.undo.split(':');gSend({type:'undo',pi:+i,joker:t});return}
  switch(d.g){
    case 'join': gJoin();break;
    case 'sound': gaToggle();break;
    case 'place': if(G.slot!=null){gSend({type:'place',slot:G.slot,tlLen:s.timeline.length,artist:G.bonusIn.artist,title:G.bonusIn.title});G.bonusIn={artist:'',title:''}}break;
    case 'next': case 'go': case 'toggle': case 'replay': case 'skip': gSend({type:d.g});break;
  }
}

/* ---------- Ereignisse (Host) ---------- */
app.addEventListener('input',e=>{
  if(GUEST){
    if(e.target.id==='gArtist') G.bonusIn.artist=e.target.value;
    if(e.target.id==='gTitle') G.bonusIn.title=e.target.value;
    return;
  }
  const t=e.target;
  if(t.dataset.nameI!=null) S.roster[+t.dataset.nameI].name=t.value;
  if(t.id==='genFrom') S.gen.from=Math.max(1900,Math.min(2030,parseInt(t.value,10)||1950));
  if(t.id==='genTo') S.gen.to=Math.max(1900,Math.min(2030,parseInt(t.value,10)||2026));
  if(t.id==='genCount') S.gen.count=Math.max(10,Math.min(300,parseInt(t.value,10)||100));
  if(t.id==='genPer') S.gen.perArtist=Math.max(1,Math.min(10,parseInt(t.value,10)||3));
  if(t.id==='genMu') S.gen.mu=parseInt(t.value,10);
  if(t.id==='webBase') S.webDraft=t.value;
  if(t.id==='genSigma') S.gen.sigma=parseInt(t.value,10);
  if(['genFrom','genTo','genCount','genMu','genSigma'].includes(t.id)) updDist();
  if(t.id==='roundSongs') S.roundSongs=Math.max(2,Math.min(500,parseInt(t.value,10)||30));
  if(t.id==='bonusArtist') S.bonusIn.artist=t.value;
  if(t.id==='bonusTitle') S.bonusIn.title=t.value;
  if(t.id==='target') S.target=Math.max(1,Math.min(50,parseInt(t.value,10)||10));
});
app.addEventListener('change',e=>{
  if(GUEST) return;
  if(e.target.id==='genGenre') S.gen.genre=e.target.value;
  if(e.target.id==='genLevel') S.gen.level=e.target.value;
  if(e.target.id==='genMb') S.gen.mb=e.target.checked;
  if(e.target.id==='genDist'){S.gen.dist=e.target.value;S.gen.distOpen=true;render()}
  if(['genMu','genSigma','genDist'].includes(e.target.id)) LS.set('gen',{...LS.get('gen',{}),dist:S.gen.dist,mu:S.gen.mu,sigma:S.gen.sigma});
  for(const k of ['keepWrong','bonus','noJokers']) if(e.target.id===k){S[k]=e.target.checked;LS.set(k,S[k]);render()}
});
app.addEventListener('click',e=>{
  if(GUEST) return gClick(e);
  const b=e.target.closest('button,a[data-act]'); if(!b) return;
  const d=b.dataset;
  if(d.copy){const v=d.copy;navigator.clipboard?.writeText(v).then(()=>toast('Kopiert.'),()=>toast('Kopieren nicht möglich, bitte markieren.'));return}
  if(d.goal){S.goal=d.goal;LS.set('goal',S.goal);render();return}
  if(d.saveload!=null){if(!S.gen.busy)loadSaved(+d.saveload);return}
  if(d.savedel!=null){deleteSaved(+d.savedel);return}
  if(d.invmode){S.inviteMode=d.invmode;render();return}
  if(d.slot!=null){if(S.players[S.cur]?.guest)return;S.slot=+d.slot;render();return}
  if(d.del!=null){S.roster.splice(+d.del,1);render();return}
  if(d.buyer!=null){if(S.players[+d.buyer]?.guest)return;S.shop.buyer=+d.buyer;if(S.shop.target===S.shop.buyer)S.shop.target=S.players.findIndex((_,i)=>i!==S.shop.buyer);render();return}
  if(d.target!=null){S.shop.target=+d.target;render();return}
  if(d.buy){if(S.shop.buyer==null||S.players[S.shop.buyer]?.guest)return;d.buy==='genre'?openGenresFor(S.shop.buyer):(buyFor(S.shop.buyer,d.buy,S.shop.target),render());return}
  if(d.genre){if(S.shop.buyer==null||S.players[S.shop.buyer]?.guest)return;pickGenreFor(S.shop.buyer,d.genre);render();return}
  if(d.genreClose){delete S.shop.genre[S.shop.buyer];render();return}
  if(d.undo){const [i,t]=d.undo.split(':');const v=S.players[+i]?.fx[t];if(!v||!JOKERS[t])return;
    if(S.players[JOKERS[t].kind==='sab'?v.by:+i]?.guest)return;undoFx(+i,t,null);render();return}
  const a=d.act; if(!a) return;
  if(b.tagName==='A') e.preventDefault();
  switch(a){
    case 'home': go('home');break;
    case 'gen': generatePlaylist();break;
    case 'genCancel': S.gen.cancel=true;genProgress('Breche ab …');break;
    case 'dzLink': loadDeezerPlaylist();break;
    case 'savePl': savePlaylist();break;
    case 'webBaseSave': saveWebBase();break;
    case 'webBaseEdit': S.webDraft=LS.get('webBase','');LS.del('webBase');render();break;
    case 'addp': S.roster.push({name:'Spieler '+(S.roster.length+1)});render();break;
    case 'start': unlockAudio();startGame();break;
    case 'place': if(!S.players[S.cur]?.guest) place();break;
    case 'next': unlockAudio();next();break;
    case 'go': unlockAudio();nextTurn();break;
    case 'toggle': togglePlay();break;
    case 'replay': replay();break;
    case 'again': go('setup');break;
    case 'quit': finish();break;
    case 'skip': unlockAudio();skipSong();break;
    case 'invite': S.showInvite=!S.showInvite;render();break;
    case 'joinOther': joinOther();break;
    case 'retryRoom': retryRoom();break;
  }
});
app.addEventListener('keydown',e=>{if(GUEST&&e.key==='Enter'&&e.target.id==='gname')gJoin()});

/* ---------- Start ---------- */
(async()=>{
  if(GUEST){document.title='Timetracker – Mitspielen';gRender();gConnect();return}
  S.screen='home';render();
})();
</script>
</body>
</html>
